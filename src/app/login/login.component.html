<div class="login-container container mx-auto h-screen flex justify-center items-center">
    <form class="bg-white shadow-md rounded px-8 pt-6 pb-6 mb-4 w-96" >
      <div class="flex justify-center">
        <img src="/assets/images/komet-logo.svg" alt="">
      </div>
        <p class="h-8 pb-2 text-center text-red-800 text-lg">{{errormsg}}</p>
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="username">
            Email
          </label>
          <input [(ngModel)]="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" id="username" type="email" placeholder="Email">
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
            Password
          </label>
          <input [(ngModel)]="password" name="password" class="shadow appearance-none border  rounded w-full py-2 px-3 text-gray-700 mb-3 leading-tight focus:outline-none focus:shadow-outline" id="password" type="password" placeholder="Password">
        </div>
        <div class="flex justify-center">
          <button [disabled]="loading" (click)="loginHandler()" class="disabled:opacity-25 bg-blue-500  text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="button">
            Log In
          </button>
        </div>
      </form>
     
</div>
