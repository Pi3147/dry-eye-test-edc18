<div id="authentication-modal" tabindex="-1" aria-hidden="true"
    class="bg-gray-800 bg-opacity-50 flex overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 justify-center items-center w-full md:inset-0 h-[calc(100%)] max-h-full">
    <div class="relative p-4 w-3/5  max-h-full">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow">
            <!-- Modal header -->
            <div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t">
                <h3 class="text-xl text-center font-semibold text-gray-900">
                    Add User in {{user.organization?.name}} Organization
                </h3>
                <button (click)="closeModel()" type="button"
                    class="end-2.5 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
                    data-modal-hide="authentication-modal">
                    <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 14 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
                    </svg>
                    <span class="sr-only">Close modal</span>
                </button>
            </div>
            <!-- Modal body -->
            <div class="p-4 md:p-5">
                <form class="space-y-4" (ngSubmit)="handalAddUser(userForm)" #userForm="ngForm">

                    <div class="flex justify-between items-center gap-4 flex-wrap">
                        <div class="flex-1">
                            <label for="employee_id" class="block mb-2 text-sm font-medium text-gray-900">Employee
                                Code*</label>
                            <input ngModel type="text" name="employee_id" id="employee_id"
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                                placeholder="Employee Code" required />
                        </div>

                        <div class="flex-1">
                            <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Name*</label>
                            <input ngModel type="text" name="name" id="name"
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                                placeholder="Name" required />
                        </div>
                    </div>

                    <div class="flex justify-between items-center gap-4 flex-wrap">

                        <div class="flex-1">
                            <label for="mobile" class="block mb-2 text-sm font-medium text-gray-900">Mobile</label>
                            <input ngModel type="text" name="mobile" id="mobile"
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                                placeholder="Mobile" />
                        </div>

                        <div class="flex-1">
                            <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email</label>
                            <input ngModel type="email" name="email" id="email"
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                                placeholder="Email" />
                        </div>
                    </div>

                    <div>
                        <label for="hq" class="block mb-2 text-sm font-medium text-gray-900">HQ</label>
                        <input ngModel type="text" name="hq" id="hq"
                            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                            placeholder="HQ" />
                    </div>

                    <div class="flex justify-between items-center gap-4 flex-wrap">

                        <div class="flex-1">
                            <label for="region" class="block mb-2 text-sm font-medium text-gray-900">Region</label>
                            <input ngModel type="text" name="region" id="region"
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                                placeholder="Region" />
                        </div>

                        <div class="flex-1">
                            <label for="zone" class="block mb-2 text-sm font-medium text-gray-900">Zone</label>
                            <input ngModel type="text" name="zone" id="zone"
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                                placeholder="Zone" />
                        </div>
                    </div>

                    <button [disabled]="!userForm.form.valid" type="submit"
                        class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center disabled:bg-blue-300">Add</button>
                </form>
            </div>
        </div>
    </div>
</div>
